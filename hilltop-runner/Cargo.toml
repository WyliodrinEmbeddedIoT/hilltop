[workspace]
members = [
    ".",
    "broker-client",
    "socket-protocol",
]

[package]
name = "hilltop-runner"
version = "0.1.0"
edition = "2024"

[features]
default = ["api-1-54"]
api-1-54 = ["dep:api-1-54"]
api-1-50 = ["dep:api-1-50"]

[dependencies]
# Project dependencies
api-1-54 = { path = "./api/api-v1.54", optional = true }
api-1-50 = { path = "./api/api-v1.50", optional = true }
broker-client = { path = "./broker-client" }
socket-protocol = { path = "./socket-protocol" }

# External dependencies
tokio = { version = "1.52.3", features = ["full"] }
futures-util = "0.3.32"
anyhow = "1.0.102"
reqwest = "0.13.4"
serde = "1.0.228"
serde_json = "1.0.150"
zip = "8.6.0"
uuid = { version = "1.23.2", features = ["v4"] }
bytes = "1.11.1"
tar = "0.4.46"
tempfile = "3.27.0"
thiserror = "2.0.18"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
nusb = "0.2.3"
