[package]
name = "socket-protocol"
version = "0.1.0"
edition = "2024"

[dependencies]
bytes = "1.11.1"
futures-util = "0.3.32"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"
tokio = "1.52.3"
tokio-tungstenite = { version = "0.29.0", features = ["native-tls"] }
tungstenite = "0.29.0"

# Testing dependencies
broker-client = { path = "../broker-client", optional = true }

[features]
testing = ["tokio/full", "dep:broker-client"]